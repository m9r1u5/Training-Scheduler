name: Build APK and Windows EXE
on:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: write}
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Restore debug keystore
        id: ks
        uses: actions/cache@v4
        with: {path: ~/.android/debug.keystore, key: debug-keystore-v1}
      - name: Create keystore if none
        if: steps.ks.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - run: npm install
      - name: Assemble web files
        run: |
          mkdir www
          cp index.html core.js app.js manifest.json sw.js icon.svg www/
      - name: Add Android project
        run: |
          npx cap add android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><uses-permission android:name="android.permission.VIBRATE"/></manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk scheduler.apk
      - uses: actions/upload-artifact@v4
        with: {name: scheduler-apk, path: scheduler.apk}

  windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Assemble desktop app from the same web files
        shell: bash
        run: |
          mkdir -p desktop/www
          cp electron-main.js desktop/main.js
          cp desktop-package.json desktop/package.json
          cp index.html core.js app.js manifest.json sw.js icon.svg icon.png desktop/www/
      - name: Build Windows installer
        shell: bash
        working-directory: desktop
        run: |
          npm install
          npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with: {name: scheduler-exe, path: desktop/dist/Training-Scheduler.exe}

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: release-files, merge-multiple: true}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Build ${{ github.run_number }}"
          files: |
            release-files/scheduler.apk
            release-files/Training-Scheduler.exe
